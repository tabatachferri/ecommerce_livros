<!DOCTYPE html>
<html lang="pt-BR">

<link rel="stylesheet" href="/custom.css">

<head>
  <meta charset="UTF-8">
  <title>Endereço de Entrega</title>
</head>

<body>

<h1>Endereço de Entrega</h1>

<h2>Selecionar endereço cadastrado</h2>

<label>
  <input type="radio" name="endereco" value="1">
  Casa — Rua das Flores, 100 - Mogi das Cruzes/SP
</label>

<br><br>

<label>
  <input type="radio" name="endereco" value="2">
  Trabalho — Avenida Brasil, 500 - São Paulo/SP
</label>

<h2>Ou inserir novo endereço</h2>

<form>

  <label>CEP:</label>
  <input type="text" name="cep">

  <br><br>

  <label>Rua:</label>
  <input type="text" name="rua">

  <br><br>

  <label>Número:</label>
  <input type="text" name="numero">

  <br><br>

  <label>Complemento:</label>
  <input type="text" name="complemento">

  <br><br>

  <label>Cidade:</label>
  <input type="text" name="cidade">

  <br><br>

  <label>Estado:</label>
  <input type="text" name="estado">

  <br><br>

  <a href="/pagamento">
    <button type="button">Continuar para pagamento</button>
  </a>

</form>

<br>

<a href="/carrinho">
  <button type="button">Voltar ao carrinho</button>
</a>

</body>

</html>
