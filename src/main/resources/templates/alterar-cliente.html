<!DOCTYPE html>
<html lang="pt-BR">

<link rel="stylesheet" href="/custom.css">

<head>
    <meta charset="UTF-8">
    <title>Alterar Cliente</title>
</head>

<body>

<h1>Alterar Cliente</h1>

<form>

    <label>Nome:</label>
    <input type="text" name="nome" value="Maria Silva">

    <br><br>

    <label>CPF:</label>
    <input type="text" name="cpf" value="123.456.789-00">

    <br><br>

    <label>E-mail:</label>
    <input type="email" name="email" value="maria@email.com">

    <br><br>

    <label>Telefone:</label>
    <input type="text" name="telefone" value="(11) 99999-9999">

    <br><br>

    <button type="submit">Salvar alterações</button>

    <a href="/clientes">
        <button type="button">Cancelar</button>
    </a>

</form>

</body>

</html>
